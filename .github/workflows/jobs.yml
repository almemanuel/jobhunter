name: Job Hunter Bot

on:
  schedule:
    # 19h00 BRT (UTC-3) — 1x ao dia
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Hunter Bot
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated seen_jobs.json
        run: |
          if ! git diff --quiet seen_jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git push
          else
            echo "Nenhuma alteração em seen_jobs.json."
          fi
